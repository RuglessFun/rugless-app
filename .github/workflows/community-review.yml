name: Community review
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  checks: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      # SECURITY: only trusted base-branch code. Never checkout a PR head here.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
      - uses: actions/github-script@v9
        with:
          script: |
            const { checkCommunityReview } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/community-review.mjs`);
            await checkCommunityReview({ github, context });
